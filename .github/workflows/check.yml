name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check SEO metadata with a test origin
        run: npm run test:browser -- tests/browser/seo.spec.ts --output=test-results/site-url
        env:
          SITE_URL: https://unitport.example
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/site-url
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
